name: vault-quick

on:
  push:
    branches: [feature/simple-training-link-drafts]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]" "setuptools>=68" wheel "msal>=1.30,<2"
      - name: Microsoft device code, vault, MFA and OAuth integration tests
        run: python -m pytest -q tests/test_microsoft_vault_device.py tests/test_microsoft_link_generation.py tests/test_microsoft_authorization_link.py tests/test_microsoft_signin.py
