# Test matrix. No secrets, no credentials, no network services: the Codex
# tests use a scripted CLI or localhost mocks. The Codex provider supports
# macOS and Linux only; on Windows the suite covers Claude and checks that
# Codex is refused (Codex-only test modules skip themselves there).
name: tests

on:
  pull_request:
  push:
    branches: [main]

# Keep only the latest validation run for a pull request while editing BB.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11", shard: all}
          - {os: ubuntu-latest, python: "3.12", shard: all}
          - {os: macos-latest, python: "3.11", shard: all}
          - {os: macos-latest, python: "3.12", shard: all}
          - {os: windows-latest, python: "3.11", shard: "1"}
          - {os: windows-latest, python: "3.11", shard: "2"}
          - {os: windows-latest, python: "3.11", shard: "3"}
          - {os: windows-latest, python: "3.11", shard: "4"}
          - {os: windows-latest, python: "3.12", shard: "1"}
          - {os: windows-latest, python: "3.12", shard: "2"}
          - {os: windows-latest, python: "3.12", shard: "3"}
          - {os: windows-latest, python: "3.12", shard: "4"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: python -m pip install -e ".[dev]" "setuptools>=68" wheel
      - name: Unit, integration, end-to-end and soak tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: python -m pytest -q
      - name: Windows regression shard (independent runner)
        if: runner.os == 'Windows'
        env:
          PYTHONFAULTHANDLER: '1'
        run: python tests/run_windows_shard.py ${{ matrix.shard }}
      - name: Installed wheel (scripted Codex CLI on PATH)
        if: runner.os != 'Windows'
        env:
          HARVEY_PACKAGE_TESTS: "1"
        run: python -m pytest -q tests/test_packaging.py
      - name: Real Codex CLI 0.159.3 against localhost mocks (no credentials)
        if: runner.os != 'Windows'
        env:
          HARVEY_CODEX_CLI_TESTS: "1"
        run: |
          npm install -g @openai/codex@0.159.3
          python -m pytest -q tests/test_codex_cli_surface.py
