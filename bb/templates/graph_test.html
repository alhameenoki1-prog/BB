<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Microsoft Graph Security Lab</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f6f8;
      font-family: Arial, sans-serif;
      color: #202124;
    }
    main {
      width: min(420px, 92vw);
      padding: 36px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0,0,0,.06);
    }
    h1 { font-size: 23px; margin: 0 0 12px; }
    p { color: #5f6368; line-height: 1.6; }
    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Microsoft Graph Security Lab</h1>
    <p>
      Sign in using your authorized Microsoft test account
      to verify Microsoft Graph connectivity.
    </p>
    <form action="/diagnostics/microsoft/start" method="post">
      <button type="submit">Sign in with Microsoft</button>
    </form>
  </main>
</body>
</html>
