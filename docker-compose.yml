services:
  harvey:
    build: .
    env_file: .env
    volumes:
      # Persist database across restarts
      - ./data:/app/data
      # Mount config for easy editing without rebuild
      - ./harvey.yaml:/app/harvey.yaml:ro
      - ./prompts:/app/prompts:ro
      - ./skills:/app/skills
      # The brain uses ANTHROPIC_API_KEY from .env (env_file above); nothing
      # else needs mounting. The container runs as non-root "harvey" (uid 1000).
    restart: unless-stopped
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
