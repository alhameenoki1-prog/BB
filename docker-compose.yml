services:
  # The hosted web app: admin-created logins, one isolated Harvey per user.
  # Put a TLS-terminating reverse proxy (Caddy, nginx, Traefik) in front and
  # set BB_BASE_URL to the public https URL. See docs/HOSTING.md.
  bb:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # All users' workspaces, the accounts database and the session secret.
      - ./data:/app/data
      # Optional: edit prompts/skills without a rebuild.
      - ./prompts:/app/prompts:ro
      - ./skills:/app/skills:ro
    restart: unless-stopped
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
