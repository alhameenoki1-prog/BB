services:
  # The hosted web app: admin-created logins, one isolated Harvey per user.
  # Put a TLS-terminating reverse proxy (Caddy, nginx, Traefik) in front and
  # set BB_BASE_URL to the public https URL. See docs/HOSTING.md.
  bb:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # All users' workspaces, the accounts database and the session secret.
      - ./data:/app/data
      # Optional: edit prompts/skills without a rebuild.
      - ./prompts:/app/prompts:ro
      - ./skills:/app/skills:ro
    restart: unless-stopped
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # HTTPS on your own domain with no other setup: `docker compose --profile tls up -d`
  # with BB_DOMAIN in .env (and BB_BASE_URL=https://that domain). Caddy gets
  # and renews the certificate itself. Without the profile, put your own
  # reverse proxy in front of port 8000.
  caddy:
    image: caddy:2
    profiles: ["tls"]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bb
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
